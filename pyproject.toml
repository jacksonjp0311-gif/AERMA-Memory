[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerma-memory"
version = "0.1.0"
description = "Governed agentic episodic memory reference implementation with drift-gated retrieval, fallback policies, benchmark tasks, baselines, repeat-run evidence, and audit-ready evidence packages."
authors = [
  { name = "James Paul Jackson" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
aerma = "aerma.cli.main:main"